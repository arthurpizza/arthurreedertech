{{ partial "header.html" . }}

<section class="page">
	<h1>{{ .Title }}</h1>

	{{ with .Content }}
	<div class="prose">{{ . }}</div>
	{{ end }}

	<div class="post-list">
	{{ range.Data.Pages }}
		<article class="post-card">
			<h2 class="post-card-title">
				<a href="{{ .RelPermalink }}">{{ .Title }}</a>
			</h2>
			<p class="post-meta">
				<time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "January 2, 2006" }}</time>
			</p>
			{{ with .Summary }}<p class="post-summary">{{ . }}</p>{{ end }}
		</article>
	{{ end }}
	</div>
</section>

{{ partial "footer.html" . }}
