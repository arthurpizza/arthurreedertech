{{ partial "header.html" . }}

<article class="page prose">
	<h1>{{ .Title }}</h1>
	{{ if not .Date.IsZero }}
	<p class="post-meta">
		<time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "January 2, 2006" }}</time>
	</p>
	{{ end }}

	{{ .Content }}
</article>

{{ partial "footer.html" . }}
