<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>

	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>

	{{- $desc := .Description | default .Site.Params.description }}
	<meta name="description" content="{{ $desc }}" />
	<meta name="author" content="{{ .Site.Params.author }}" />
	<meta name="theme-color" content="#0d141b" />

	<link rel="canonical" href="{{ .Permalink }}" />

	<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}" />
	<meta property="og:site_name" content="{{ .Site.Title }}" />
	<meta property="og:title" content="{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}" />
	<meta property="og:description" content="{{ $desc }}" />
	<meta property="og:url" content="{{ .Permalink }}" />
	<meta property="og:image" content="{{ "/image/black-logo.svg" | absURL }}" />

	<meta name="twitter:card" content="summary" />
	<meta name="twitter:title" content="{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}" />
	<meta name="twitter:description" content="{{ $desc }}" />

	<link rel="icon" href="/image/black-favion.webp" type="image/webp" />
	<link rel="stylesheet" href="/css/style.css" type="text/css" media="all" />

	{{ with .OutputFormats.Get "rss" -}}
		{{ printf `<link rel="%s" type="%s" href="%s" title="%s" />` .Rel .MediaType.Type .Permalink $.Site.Title | safeHTML }}
	{{ end -}}

</head>

<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
	<div class="header-inner">
		<a class="brand" href="/" aria-label="{{ .Site.Title }} — home">
			<img class="brand-logo" alt="" src="/image/black-logo.svg" width="44" height="44" />
			<span class="brand-name">Arthur Reeder <span class="brand-tech">TECH</span></span>
		</a>

		<nav class="site-nav" aria-label="Main">
			<ul>
				<li>
					<a href="/"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a>
				</li>
				<li>
					<a href="/#services">Services</a>
				</li>
				<li>
					<a href="/about/"{{ if eq .Section "about" }} aria-current="page"{{ end }}>About</a>
				</li>
				<li>
					<a href="/posts/"{{ if eq .Section "posts" }} aria-current="page"{{ end }}>News</a>
				</li>
			</ul>
		</nav>
	</div>
</header>

<main class="content" id="main">
